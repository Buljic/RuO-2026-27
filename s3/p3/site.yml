- hosts: web
  become: true
  gather_facts: false
  pre_tasks:
    - name: čekaj da SSH postane dostupan
      ansible.builtin.wait_for_connection: { timeout: 300 }
    - name: čekaj da cloud-init završi
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
    - name: prikupi činjenice
      ansible.builtin.setup:
  roles:
    - webserver
