apiVersion: v1
kind: ConfigMap
metadata:
  name: web-index
data:
  index.html: |
    <h1>RuO: nginx na Kubernetesu</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { memory: 64Mi }        # postaje cgroup memory.max (sedmica 1)
          volumeMounts:
            - { name: index, mountPath: /usr/share/nginx/html }
      volumes:
        - name: index
          configMap: { name: web-index }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
